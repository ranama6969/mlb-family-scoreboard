<!doctype html>
<html lang="en"><head>

<style>
:root{--bg:#03080e;--p:#08131f;--p2:#0c1926;--line:#263746;--muted:#93a2b0;--text:#f7f9fb;--blue:#1377d2;--red:#ed2144}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}button,input{font:inherit}button{color:inherit}
#app{width:100vw;height:100vh;display:grid;grid-template-columns:270px 1fr;background:linear-gradient(135deg,#02070c,#08131f 60%,#02070c)}
aside{border-right:1px solid var(--line);background:#030b13;padding:16px 13px;overflow:hidden}.brand{display:flex;gap:10px;align-items:center;margin:0 6px 15px}.brandmark{width:57px;height:38px;border:2px solid #fff;border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:950;font-size:15px}.brand b{font-size:19px}.brand small{display:block;color:#82919f;font-size:9px;letter-spacing:.12em}.sportnav{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin:0 4px 13px}.sport{background:#091521;border:1px solid #263949;border-radius:7px;padding:8px 3px;font-size:11px;font-weight:900;cursor:pointer}.sport.active{background:#0865bd;border-color:#2688e8}.section{font-size:10px;font-weight:900;letter-spacing:.1em;color:#8d9ba9;margin:14px 7px 7px}.search{width:100%;background:#081622;border:1px solid #344858;border-radius:8px;padding:9px;color:white;outline:none}.teams{height:calc(100vh - 300px);overflow:auto}.team{width:100%;display:flex;align-items:center;gap:8px;background:none;border:0;border-bottom:1px solid #1b2935;border-radius:7px;padding:8px 6px;text-align:left;cursor:pointer}.team.active,.team:hover{background:#0c3d70}.team img{width:30px;height:30px;object-fit:contain}.team span{font-size:12px;font-weight:700}.team em{margin-left:auto;color:#7d8b99;font-style:normal}
main{min-width:0;display:flex;flex-direction:column}.top{height:83px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px;padding:9px 17px}.nav{width:39px;height:53px;background:#091520;border:1px solid #263948;border-radius:8px;font-size:27px}.dates{display:flex;gap:6px;flex:1;overflow:hidden}.day{min-width:94px;height:56px;background:#091520;border:1px solid #1e3040;border-radius:8px;color:white;cursor:pointer}.day.active{background:#0864bd;border-color:#2586e8}.day b{display:block;font-size:10px}.day span{font-size:14px;font-weight:900}.day small{display:block;color:#93a1ae;font-size:8px}.active small{color:#d9edff}.now{width:105px;text-align:right}.now small{display:block;color:#82909d;font-size:9px}.now b{font-size:18px}
.content{padding:12px 17px;display:flex;flex-direction:column;gap:9px;min-height:0;overflow:hidden}.toolbar{display:flex;justify-content:space-between;align-items:center}.toolbar h1{font-size:18px;margin:0}.toolbar span{font-size:10px;color:#84929f}.games{display:flex;gap:7px;overflow:auto}.game{min-width:142px;background:#081521;border:1px solid #263847;border-radius:8px;padding:7px;text-align:left;cursor:pointer}.game.selected{border-color:#2584e1;box-shadow:0 0 0 1px #2584e1 inset}.game .time{font-size:9px;color:#a5b1bd}.pair{display:flex;align-items:center;justify-content:space-between;margin-top:5px}.pair img{width:27px;height:27px;object-fit:contain}.pair b{font-size:16px}.tag{font-size:8px;color:#65b7ff;font-weight:900;margin-top:4px}.scoreboard{flex:1;min-height:0;border:1px solid #293b4a;border-radius:11px;background:linear-gradient(145deg,#07131e,#020a11);display:flex;flex-direction:column;overflow:hidden}.head{height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 17px;color:#aab6c1}.badge{font-size:10px;font-weight:900;padding:6px 10px;border-radius:6px;background:#1a2732}.badge.live{background:#ed1f40;color:white}.venue{text-align:right;font-size:9px;line-height:1.2}.match{flex:1;min-height:0;display:grid;grid-template-columns:1fr 135px 1fr;align-items:center;padding:0 4%}.club{text-align:center}.logo{width:clamp(80px,9vw,145px);height:clamp(80px,9vw,145px);object-fit:contain}.clubname{font-size:clamp(16px,2vw,28px);font-weight:950}.record{font-size:10px;color:#8493a1;margin-top:4px}.bigscore{text-align:center;font-size:clamp(53px,7vw,108px);font-weight:950;letter-spacing:-.07em}.dash{color:#65727d}.vline{width:2px;height:68px;background:#52616d;margin:0 auto 11px}.inning{text-align:center;font-size:19px;font-weight:900}.outs{text-align:center;color:#bdc7d0;font-size:11px;margin-top:4px}.bases{position:relative;width:42px;height:42px;margin:12px auto}.base{position:absolute;width:15px;height:15px;transform:rotate(45deg);background:#5e6c78}.base.on{background:#ffd02b}.b2{left:13px}.b1{right:0;top:13px}.b3{left:0;top:13px}.details{height:90px;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr}.detail{padding:11px 5%}.detail+.detail{border-left:1px solid var(--line)}.smalllabel{font-size:8px;letter-spacing:.13em;color:#8796a4;font-weight:900}.player{font-size:16px;font-weight:900;margin-top:4px}.stat{font-size:10px;color:#bac5cf;margin-top:3px}.recent{height:85px}.recent h3{font-size:11px;margin:0 0 4px}.recentlist{display:flex;gap:6px;overflow:auto}.recentcard{min-width:155px;background:#07131f;border:1px solid #223442;border-radius:7px;padding:6px}.recentcard small{color:#8795a2;font-size:8px}.recentpair{display:flex;justify-content:space-between;align-items:center}.recentpair img{width:21px;height:21px;object-fit:contain}.recentpair b{font-size:13px}
.kiosk{position:fixed;right:8px;bottom:5px;color:#4f5d68;font-size:8px}
@media(max-width:750px){#app{grid-template-columns:205px 1fr}.match{grid-template-columns:1fr 85px 1fr}.content{padding:8px}.day{min-width:75px}}

.kioskbtn{position:fixed;right:14px;top:12px;z-index:20;border:1px solid #405363;background:#0a1723;color:#dfe7ee;border-radius:8px;padding:8px 11px;font-size:11px;font-weight:800;cursor:pointer}
.exitbtn{position:fixed;right:14px;top:12px;z-index:20;display:none;border:1px solid #405363;background:#0a1723;color:#dfe7ee;border-radius:8px;padding:8px 11px;font-size:11px;font-weight:800;cursor:pointer}
body.fullscreen #app{display:block}
body.fullscreen aside,body.fullscreen .top,body.fullscreen .toolbar,body.fullscreen .games,body.fullscreen .recent,body.fullscreen .kiosk{display:none!important}
body.fullscreen main{width:100vw;height:100vh}
body.fullscreen .content{padding:0;width:100vw;height:100vh;display:block}
body.fullscreen .scoreboard{width:100vw;height:100vh;border:0;border-radius:0}
body.fullscreen .head{height:8vh;padding:0 3vw}
body.fullscreen .match{height:70vh;padding:0 7vw;grid-template-columns:1fr 170px 1fr}
body.fullscreen .details{height:22vh}
body.fullscreen .logo{width:clamp(120px,16vw,230px);height:clamp(120px,16vw,230px)}
body.fullscreen .clubname{font-size:clamp(22px,3vw,44px)}
body.fullscreen .bigscore{font-size:clamp(90px,13vw,210px)}
body.fullscreen .inning{font-size:clamp(24px,3vw,42px)}
body.fullscreen .outs{font-size:clamp(15px,1.7vw,25px)}
body.fullscreen .details .detail{padding:20px 7%}
body.fullscreen .player{font-size:clamp(22px,2.4vw,38px)}
body.fullscreen .stat{font-size:clamp(13px,1.4vw,21px)}
body.fullscreen .smalllabel{font-size:clamp(10px,1vw,16px)}
@media (orientation:portrait){body.fullscreen #app{min-width:100vh;transform:rotate(90deg);transform-origin:center}}
</style>
<style>
.view-modes{display:flex;gap:8px;margin:10px 0 12px}
.mode-btn{border:1px solid #39404b;background:#171a1f;color:#cfd5dd;border-radius:8px;padding:8px 12px;font-weight:700;font-size:12px;letter-spacing:.04em}
.mode-btn.active{background:#f2f4f7;color:#101318;border-color:#f2f4f7}
.mode-panel{display:none}
body[data-mode="standings"] .mode-panel,
body[data-mode="yesterday"] .mode-panel{display:block}
body[data-mode="standings"] .games,
body[data-mode="yesterday"] .games,
body[data-mode="standings"] .recent,
body[data-mode="yesterday"] .recent{display:none}
.standings-card{background:#15181d;border:1px solid #2a3039;border-radius:12px;padding:14px}
.standings-title{font-size:18px;font-weight:800;margin-bottom:10px}
.standings-sub{color:#8d96a3;font-size:12px;margin-bottom:10px}
.st-row{display:grid;grid-template-columns:28px 1fr repeat(5,auto);gap:8px;align-items:center;padding:8px 4px;border-top:1px solid #252a32;font-size:13px}
.st-row.head{border-top:0;color:#8d96a3;font-size:10px;text-transform:uppercase;font-weight:700}
.st-team{font-weight:800}
.st-tor{background:#222832;border-radius:7px}
.y-card{min-height:280px;background:#111419;border:1px solid #2a3039;border-radius:14px;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:20px;text-align:center}
.y-label{font-size:12px;letter-spacing:.12em;color:#8d96a3;font-weight:800;margin-bottom:12px}
.y-teams{font-size:25px;font-weight:900;line-height:1.35}
.y-score{font-size:58px;font-weight:950;line-height:1;margin:8px 0}
.y-status{font-size:13px;color:#aeb6c2;font-weight:700}
.y-dots{margin-top:14px;color:#7f8792;font-size:12px}
@media(max-width:700px){.st-row{grid-template-columns:24px 1fr repeat(5,auto);gap:5px;font-size:12px}.st-row .hide-sm{display:none}.y-score{font-size:48px}}
</style>

</head>
<body>
<button id="enterKiosk" class="kioskbtn">FULL SCREEN</button>
<button id="exitKiosk" class="exitbtn">EXIT FULL SCREEN</button>
<div id="app">
<aside><div class="brand"><div class="brandmark">TS</div><div><b>TORONTO SPORTS</b><small>FAMILY SCOREBOARD</small></div></div>
<div class="sportnav"><button class="sport active" data-sport="mlb">⚾ MLB</button><button class="sport" data-sport="nhl">🏒 NHL</button><button class="sport" data-sport="nba">🏀 NBA</button></div>
<div class="section">FAVOURITES</div><div id="favs"></div><div class="section" id="allLabel">ALL TEAMS</div><input id="search" class="search" placeholder="Search teams…"><div id="teams" class="teams"></div></aside>
<main><div class="top"><button class="nav" id="prev">‹</button><div id="dates" class="dates"></div><button class="nav" id="next">›</button><div class="now"><small id="today"></small><b id="clock"></b></div></div>
<div class="content"><div class="toolbar"><h1 id="title">Toronto Blue Jays</h1><span>Tap any game to display it</span></div><div id="games" class="games"></div>
<div class="scoreboard"><div class="head"><div id="badge" class="badge">—</div><div id="venue" class="venue">—</div></div>
<div class="match"><div class="club"><img id="hl" class="logo"><div id="hn" class="clubname">—</div><div id="hr" class="record"></div></div>
<div><div class="bigscore"><span id="hs">—</span><span class="dash"> – </span><span id="as">—</span></div><div class="vline"></div><div id="inn" class="inning">—</div><div id="outs" class="outs"></div><div class="bases"><div id="b2" class="base b2"></div><div id="b1" class="base b1"></div><div id="b3" class="base b3"></div></div></div>
<div class="club"><img id="al" class="logo"><div id="an" class="clubname">—</div><div id="ar" class="record"></div></div></div>
<div class="details"><div class="detail"><div class="smalllabel" id="leftLabel">KEY STAT</div><div id="bat" class="player">—</div><div id="batstat" class="stat">—</div></div><div class="detail"><div class="smalllabel" id="rightLabel">KEY STAT</div><div id="pit" class="player">—</div><div id="pitstat" class="stat">—</div></div></div></div>
<div class="recent"><h3>RECENT / COMPLETED GAMES</h3><div id="recentlist" class="recentlist"></div></div>
</div></main></div><div class="kiosk">Live data refreshes automatically</div>
<script>
const cfg={
mlb:{sport:"baseball",league:"mlb",default:"14",favs:["14","10","2","13","15"],placeholder:"Search MLB teams…"},
nhl:{sport:"hockey",league:"nhl",default:"21",favs:["21","25","12","1","10"],placeholder:"Search NHL teams…"},
nba:{sport:"basketball",league:"nba",default:"28",favs:["28","17","2","13","5"],placeholder:"Search NBA teams…"}
};
let sport="mlb",teams=[],events=[],teamId=cfg.mlb.default,day=new Date(),selected=null;
const $=x=>document.getElementById(x), id=x=>String(x?.id||""), logo=x=>x?.logos?.[0]?.href||x?.logo||"";
const dateKey=d=>d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0");
function sides(e){return e?.competitions?.[0]?.competitors||[]}function side(e,h){return sides(e).find(x=>x.homeAway===h)||{}}
function live(e){return e?.competitions?.[0]?.status?.type?.state==="in"}function fin(e){return e?.competitions?.[0]?.status?.type?.completed===true}
function api(){return `https://site.api.espn.com/apis/site/v2/sports/${cfg[sport].sport}/${cfg[sport].league}`}
function teamButton(t){return `<button class="team ${id(t)===teamId?"active":""}" data-id="${id(t)}"><img src="${logo(t)}"><span>${t.displayName}</span><em>›</em></button>`}
function renderTeams(){let q=$("search").value.toLowerCase(),list=teams.filter(t=>t.displayName.toLowerCase().includes(q)||t.abbreviation?.toLowerCase().includes(q));$("teams").innerHTML=list.map(teamButton).join("");$("favs").innerHTML=cfg[sport].favs.map(x=>teams.find(t=>id(t)===x)).filter(Boolean).map(teamButton).join("");document.querySelectorAll(".team").forEach(b=>b.onclick=()=>{teamId=b.dataset.id;renderTeams();load()})}
function renderDates(){let s="";for(let i=-2;i<=4;i++){let x=new Date(day);x.setDate(x.getDate()+i);s+=`<button class="day ${i===0?"active":""}" data-i="${i}"><b>${x.toLocaleDateString(undefined,{weekday:"short"}).toUpperCase()}</b><span>${x.toLocaleDateString(undefined,{month:"short",day:"numeric"}).toUpperCase()}</span><small>${i===0?"SELECTED":""}</small></button>`}$("dates").innerHTML=s;document.querySelectorAll(".day").forEach(b=>b.onclick=()=>{let i=+b.dataset.i;day.setDate(day.getDate()+i);load()})}
function card(e){let h=side(e,"home"),a=side(e,"away");return `<button class="game ${selected===e.id?"selected":""}" data-id="${e.id}"><div class="time">${new Date(e.date).toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"})}</div><div class="pair"><img src="${logo(h.team)}"><b>${h.score??"–"}</b><span>–</span><b>${a.score??"–"}</b><img src="${logo(a.team)}"></div><div class="tag">${live(e)?"● LIVE":fin(e)?"FINAL":"UPCOMING"}</div></button>`}
function keyStats(c,sit){if(sport==="mlb")return {ll:"AT BAT",rl:"ON THE MOUND",l:sit.batter?.athlete?.displayName||"—",r:sit.pitcher?.athlete?.displayName||"—",ls:sit.batter?"CURRENT AT-BAT":"—",rs:sit.pitcher?"CURRENT PITCHER":"—"};if(sport==="nhl")return {ll:"LEADING SCORER",rl:"GOALTENDER",l:c?.leaders?.[0]?.leaders?.[0]?.athlete?.displayName||"—",r:c?.leaders?.find(x=>x.name==="goaltending")?.leaders?.[0]?.athlete?.displayName||"—",ls:"KEY PLAYER",rs:"GOALIE"};return {ll:"TOP SCORER",rl:"KEY STAT",l:c?.leaders?.[0]?.leaders?.[0]?.athlete?.displayName||"—",r:"GAME TOTALS",ls:"LEADING SCORER",rs:"—"}}
function show(e){if(!e)return;let h=side(e,"home"),a=side(e,"away"),c=e.competitions?.[0],s=c?.status||{},sit=c?.situation||{};$("hl").src=logo(h.team);$("al").src=logo(a.team);$("hn").textContent=h.team?.displayName||"—";$("an").textContent=a.team?.displayName||"—";$("hs").textContent=h.score??"–";$("as").textContent=a.score??"–";$("hr").textContent=h.records?.[0]?.summary||"";$("ar").textContent=a.records?.[0]?.summary||"";$("venue").innerHTML=(c.venue?.fullName||"")+"<br>"+(c.venue?.address?.city||"");$("badge").textContent=live(e)?"● LIVE":fin(e)?"FINAL":"UPCOMING";$("badge").className="badge"+(live(e)?" live":"");let p=s.period;let inn=p?(sport==="mlb"?(p===1?"1ST":p===2?"2ND":p===3?"3RD":p+"TH"):(sport==="nhl"?"PERIOD "+p:"Q"+p)):"";$("inn").textContent=live(e)?inn:(fin(e)?"FINAL":new Date(e.date).toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"}));$("outs").textContent=sit.outs!=null?sit.outs+" OUTS":situationText(c);["b1","b2","b3"].forEach((x,i)=>$(x).classList.toggle("on",[sit.onFirst,sit.onSecond,sit.onThird][i]));let k=keyStats(c,sit);$("leftLabel").textContent=k.ll;$("rightLabel").textContent=k.rl;$("bat").textContent=k.l;$("pit").textContent=k.r;$("batstat").textContent=k.ls;$("pitstat").textContent=k.rs;$("title").textContent=(h.team?.abbreviation||"")+" vs "+(a.team?.abbreviation||"")}
function situationText(c){if(sport==="nhl")return c?.status?.type?.shortDetail||"";if(sport==="nba")return c?.status?.type?.shortDetail||"";return ""}
function render(){ $("games").innerHTML=events.length?events.map(card).join(""):'<div style="color:#8896a3;padding:9px">No games for this date.</div>';document.querySelectorAll(".game").forEach(b=>b.onclick=()=>{selected=b.dataset.id;render()});let p=events.filter(fin).slice(-7).reverse();$("recentlist").innerHTML=p.map(e=>{let h=side(e,"home"),a=side(e,"away");return `<div class="recentcard"><small>${new Date(e.date).toLocaleDateString()}</small><div class="recentpair"><img src="${logo(h.team)}"><b>${h.score} – ${a.score}</b><img src="${logo(a.team)}"></div></div>`}).join("")||'<div style="color:#71808e;font-size:9px">Completed games appear here.</div>';if(selected)show(events.find(e=>e.id===selected))}
async function load(){renderDates();try{let r=await fetch(`${api()}/scoreboard?dates=${dateKey(day)}`,{cache:"no-store"});let j=await r.json();let all=j.events||[];events=all.filter(e=>sides(e).some(c=>id(c.team)===teamId));if(!events.length)events=all;selected=events.find(live)?.id||events.find(fin)?.id||events[0]?.id||null;render()}catch(e){$("games").innerHTML='<div style="color:#d36b79;padding:9px">Live data unavailable. Check your connection.</div>'}}
async function switchSport(x){sport=x;teamId=cfg[x].default;teams=[];$("search").placeholder=cfg[x].placeholder;document.querySelectorAll(".sport").forEach(b=>b.classList.toggle("active",b.dataset.sport===x));await loadTeams();startRefreshTimer();load()}
async function loadTeams(){try{let r=await fetch(`${api()}/teams?limit=100`);let j=await r.json();teams=(j.sports?.[0]?.leagues?.[0]?.teams||[]).map(x=>x.team).filter(Boolean)}catch(e){teams=[]}renderTeams()}
document.querySelectorAll(".sport").forEach(b=>b.onclick=()=>switchSport(b.dataset.sport));$("search").oninput=renderTeams;$("prev").onclick=()=>{day.setDate(day.getDate()-1);load()};$("next").onclick=()=>{day.setDate(day.getDate()+1);load()};setInterval(()=>{$("clock").textContent=new Date().toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});$("today").textContent=new Date().toLocaleDateString(undefined,{month:"short",day:"numeric"})},1000);let refreshTimer;
function startRefreshTimer(){
  clearInterval(refreshTimer);
  const interval = (sport==="nhl" || sport==="nba") ? 15000 : 30000;
  refreshTimer=setInterval(load,interval);
}
startRefreshTimer();
loadTeams().then(load);

const enterKiosk=()=>{document.body.classList.add("fullscreen");$("enterKiosk").style.display="none";$("exitKiosk").style.display="block";try{if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen()}catch(e){}};
const exitKiosk=()=>{document.body.classList.remove("fullscreen");$("enterKiosk").style.display="block";$("exitKiosk").style.display="none";try{if(document.fullscreenElement&&document.exitFullscreen)document.exitFullscreen()}catch(e){}};
$("enterKiosk").onclick=enterKiosk;$("exitKiosk").onclick=exitKiosk;
document.addEventListener("fullscreenchange",()=>{if(!document.fullscreenElement && document.body.classList.contains("fullscreen")){document.body.classList.remove("fullscreen");$("enterKiosk").style.display="block";$("exitKiosk").style.display="none";}});
</script>
<div class="view-modes" id="viewModes">
  <button class="mode-btn active" data-mode="today">TODAY</button>
  <button class="mode-btn" data-mode="yesterday">YESTERDAY</button>
  <button class="mode-btn" data-mode="standings">STANDINGS</button>
</div>
<div id="modePanel" class="mode-panel"></div>


<script>
(() => {
  const modeButtons = [...document.querySelectorAll('.mode-btn')];
  const modePanel = document.getElementById('modePanel');
  let selectedMode = 'today';
  let yesterdayGames = [];
  let yesterdayIndex = 0;
  let yesterdayTimer = null;

  const sportMap = {
    MLB: {sport:'baseball', league:'mlb', refresh:30000},
    NHL: {sport:'hockey', league:'nhl', refresh:15000},
    NBA: {sport:'basketball', league:'nba', refresh:15000}
  };

  function fmtDate(d){
    const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
    return `${y}${m}${day}`;
  }
  function yesterdayKey(){ const d=new Date(); d.setDate(d.getDate()-1); return fmtDate(d); }
  function apiBase(){
    const s = sportMap[window.currentSport || 'MLB'];
    return `https://site.api.espn.com/apis/site/v2/sports/${s.sport}/${s.league}`;
  }
  function standingsUrl(){
    const s = sportMap[window.currentSport || 'MLB'];
    return `https://site.api.espn.com/apis/v2/sports/${s.sport}/${s.league}/standings`;
  }
  function logoFor(comp, idx){
    return comp?.competitors?.[idx]?.team?.logos?.[0]?.href || comp?.competitors?.[idx]?.team?.logo || '';
  }
  function nameFor(comp, idx){
    const t=comp?.competitors?.[idx]?.team || {};
    return t.displayName || t.shortDisplayName || t.name || '';
  }

  async function loadYesterday(){
    const key=yesterdayKey();
    const data=await fetch(`${apiBase()}/scoreboard?dates=${key}`).then(r=>r.json());
    yesterdayGames=(data.events||[]).filter(e=>{
      const c=e.competitions?.[0];
      return c && c.status?.type?.completed;
    });
    yesterdayIndex=0;
    renderYesterday();
    clearInterval(yesterdayTimer);
    if(yesterdayGames.length>1){
      yesterdayTimer=setInterval(()=>{
        yesterdayIndex=(yesterdayIndex+1)%yesterdayGames.length;
        renderYesterday();
      },8000);
    }
  }

  function renderYesterday(){
    if(!yesterdayGames.length){
      modePanel.innerHTML='<div class="y-card"><div class="y-label">YESTERDAY</div><div class="y-teams">No completed games</div><div class="y-status">Try another sport or check back during the season.</div></div>';
      return;
    }
    const e=yesterdayGames[yesterdayIndex], c=e.competitions[0], teams=c.competitors||[];
    const a=teams.find(x=>x.homeAway==='away')||teams[0], h=teams.find(x=>x.homeAway==='home')||teams[1];
    const scoreA=a?.score ?? '—', scoreH=h?.score ?? '—';
    modePanel.innerHTML=`
      <div class="y-card">
        <div class="y-label">${(window.currentSport||'MLB')} · YESTERDAY · FINAL</div>
        <div class="y-teams">${a?.team?.displayName||'Away'}<br>${h?.team?.displayName||'Home'}</div>
        <div class="y-score">${scoreA} — ${scoreH}</div>
        <div class="y-status">${yesterdayIndex+1} of ${yesterdayGames.length}</div>
        <div class="y-dots">${'●'.repeat(yesterdayIndex+1)}${'○'.repeat(Math.max(0,yesterdayGames.length-yesterdayIndex-1))}</div>
      </div>`;
  }

  async function loadStandings(){
    const data=await fetch(standingsUrl()).then(r=>r.json());
    const groups=data.children||[];
    const sections=[];
    groups.forEach(group=>{
      const entries=group.standings?.entries||[];
      if(!entries.length) return;
      const rows=entries.map((entry,i)=>{
        const team=entry.team||{};
        const stats={};
        (entry.stats||[]).forEach(s=>stats[s.name]=s.value);
        const abbr=team.abbreviation||team.shortDisplayName||team.displayName||'';
        const wins=stats.wins ?? stats.overallWins ?? '';
        const losses=stats.losses ?? stats.overallLosses ?? '';
        const ties=stats.ties ?? stats.overallTies ?? '';
        const pct=stats.winPercent!=null ? Number(stats.winPercent).toFixed(3).replace(/^0/,'') : '';
        const points=stats.points ?? '';
        const gamesBehind=stats.gamesBehind ?? '';
        const isTor=/^(TOR|Toronto)/i.test(abbr+' '+(team.displayName||''));
        return `<div class="st-row ${isTor?'st-tor':''}">
          <div>${i+1}</div><div class="st-team">${abbr}</div>
          <div>${wins}</div><div>${losses}</div>
          <div class="hide-sm">${ties}</div><div class="hide-sm">${pct}</div><div>${points || gamesBehind}</div>
        </div>`;
      }).join('');
      sections.push(`<div class="standings-card"><div class="standings-title">${group.name||'Standings'}</div>
        <div class="standings-sub">${(window.currentSport||'MLB')} · current standings</div>
        <div class="st-row head"><div>#</div><div>Team</div><div>W</div><div>L</div><div class="hide-sm">T</div><div class="hide-sm">PCT</div><div>PTS/GB</div></div>
        ${rows}</div>`);
    });
    modePanel.innerHTML=sections.join('<div style="height:10px"></div>') || '<div class="y-card">Standings unavailable.</div>';
  }

  async function setMode(mode){
    selectedMode=mode;
    document.body.dataset.mode=mode;
    modeButtons.forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));
    clearInterval(yesterdayTimer);
    if(mode==='today'){
      if(typeof window.load==='function') window.load();
    }else if(mode==='yesterday'){
      await loadYesterday();
    }else{
      await loadStandings();
    }
  }

  modeButtons.forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));

  // Expose a small hook for the existing sport switcher to refresh the new views.
  window.refreshExtraViews = () => {
    if(selectedMode==='yesterday') loadYesterday();
    if(selectedMode==='standings') loadStandings();
  };

  // Detect common existing sport-switch functions by wrapping if present later.
  const oldSwitch = window.switchSport;
  if(oldSwitch){
    window.switchSport = async function(...args){
      const r=await oldSwitch.apply(this,args);
      window.refreshExtraViews();
      return r;
    };
  }

  document.addEventListener('visibilitychange',()=>{ if(document.hidden) clearInterval(yesterdayTimer); });
})();
</script>

</body></html>
